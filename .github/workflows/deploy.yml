name: Deploy to Zoho Catalyst (AppSail)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Install Catalyst CLI & Deploy
        env:
          CATALYST_AUTH_TOKEN: ${{ secrets.CATALYST_AUTH_TOKEN }}
        run: |
          npm install -g zcatalyst-cli
          catalyst deploy --token $CATALYST_AUTH_TOKEN
